<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay demo · TWC</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  /* The Replay demo, served at /replay (kept outside static/ so that is its only address). It plays real recordings:
     once-a-second readings in static/replay-data/, written by make_replay_data.py, which also runs the real rules
     over them for step 2. Still made up: "Add your GPUs" (the your-box view). The version with made-up data, earlier
     stages, the old live page and IVO: demo-classifier/parked-pages/. */
  .mockbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 18px; padding: 8px 12px;
             border: 1px dashed var(--axis); border-radius: 10px; font-size: 12.5px; color: var(--ink2); }
  .mockbar b { color: var(--ink); letter-spacing: .04em; font-size: 11.5px; }
  .mockbar .what { flex-basis: 100%; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 7px; overflow: hidden; }
  .seg button { font: inherit; font-size: 12.5px; border: 0; background: var(--page); color: var(--ink2); padding: 4px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--ring); }
  .seg button.on { background: var(--grid); color: var(--ink); font-weight: 600; }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--ring); border-radius: 4px; padding: 0 4px; }

  .mockbar .lab { font-weight: 600; color: var(--ink); margin-right: -4px; }
  /* tighter page: a narrower column (so more margin left and right) and less space between things */
  /* The left edge sits where the site's 1080 px column starts, so the top bar does not shift between tabs. The main
     column keeps the width it had beside a 292 px diagram (772 px); the diagram column is 340 px, so the page runs
     48 px further right than other tabs, hanging into the right margin (and up to 20 px into the page's own padding
     on a narrow window, before the main column gives anything up). */
  body > #app { max-width: 1128px !important; margin-left: max(0px, calc((100% - 1080px) / 2)) !important; margin-right: -20px !important; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .head h1 { margin: 0; }
  .grow { flex: 1; }
  .clock { font: 13px ui-monospace, Menlo, monospace; color: var(--ink2); }
  .btn { font: inherit; font-size: 12.5px; border: 1px solid var(--axis); border-radius: 0; background: transparent;
         color: var(--ink); padding: 4px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--grid); }
  .btn.primary { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .btn.quiet { border-color: transparent; }
  .livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: inline-block; margin-right: 6px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* the Walkthrough's pills: quiet ones for a list of choices, the "big" switch for the one main choice */
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pills button { font: inherit; font-size: 14px; padding: 4px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--ink2); cursor: pointer; }
  .pills button:hover:not(.on) { background: rgba(11,11,11,.05); }
  .pills button.on { background: var(--grid); color: var(--ink); font-weight: 600; }
  .pills.big { display: inline-flex; flex-wrap: nowrap; padding: 3px; gap: 2px; border-radius: 9px; background: #e8e7e1; }
  .pills.big button { font-size: 15px; padding: 6px 22px; border-radius: 7px; }
  .pills.big button:hover:not(.on) { background: rgba(11,11,11,.04); }
  .pills.big button.on { background: var(--surface); box-shadow: 0 1px 2px rgba(11,11,11,.12); }
  /* step 1's selector ("C2", picked 2026-11-12): workload as underline tabs, then the levers side by side, each a
     small capitalised label over the page's quiet pills */
  .tabs { display: flex; gap: 22px; flex: 1; border-bottom: 1px solid var(--grid); }
  .tabs button { font: inherit; font-size: 14.5px; border: 0; background: none; padding: 0 0 7px; color: var(--ink2); cursor: pointer;
                 border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs button:hover:not(.on) { color: var(--ink); }
  .tabs button.on { color: var(--ink); font-weight: 600; border-color: var(--ink); }
  .levers { display: flex; flex-wrap: wrap; gap: 10px 28px; }
  .levers .ln { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 11px; }
  .levers .pills { gap: 2px; }
  .levers .pills button { font-size: 13.5px; padding: 3px 11px; }
  .levers .pills button.far { color: var(--muted); }
  .levers .pills button:disabled { color: var(--axis); cursor: default; background: transparent; }
  .wl { display: flex; align-items: flex-end; gap: 14px; justify-self: stretch; }
  .wl details.menu { margin-bottom: 6px; }
  /* Side by side ("C·2", picked 2026-11-12): one row per node; the summary is the picker, each level its own small menu */
  .sidelist { display: grid; gap: 4px; }
  .srow { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .srow .nn { font: 12.5px ui-monospace, Menlo, monospace; color: var(--ink2); white-space: nowrap; padding-left: 11px; }
  .srow .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; }
  .segs { display: flex; flex-wrap: wrap; align-items: center; gap: 1px; }
  .segs .sep { color: var(--axis); padding: 0 2px; }
  .sseg { position: relative; }
  .sseg > button { font: inherit; font-size: 13.5px; padding: 3px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .sseg > button::after { content: " ▾"; color: var(--muted); font-size: 10px; }
  .sseg > button:hover, .sseg.open > button { background: var(--grid); }
  .sseg.first > button { font-weight: 600; }
  .sseg .pop { position: absolute; top: calc(100% + 4px); left: 0; z-index: 8; background: var(--surface); border: 1px solid var(--axis); padding: 6px 0;
              min-width: 190px; box-shadow: 0 4px 14px rgba(11,11,11,.08); }
  .sseg .pop .g { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 4px 12px; }
  .sseg .pop button { display: flex; width: 100%; justify-content: flex-start; gap: 0; font: inherit; font-size: 13.5px; border: 0; background: none;
                     padding: 5px 14px 5px 8px; cursor: pointer; color: var(--ink); text-align: left; white-space: nowrap; }
  .sseg .pop button:hover:not(:disabled) { background: rgba(11,11,11,.05); }
  .sseg .pop button::before { content: ""; width: 16px; flex: none; } .sseg .pop button.on { font-weight: 600; } .sseg .pop button.on::before { content: "✓"; }
  .sseg .pop button.far { color: var(--muted); }
  .sseg .pop button:disabled { color: var(--axis); cursor: default; }
  .sseg .pop small { color: var(--muted); font-size: 11.5px; font-weight: 400; margin-left: auto; padding-left: 14px; }
  .srm { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 4px; }
  .srm:hover { color: var(--ink); }
  .sadd { font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink2); cursor: pointer; padding: 2px 0 0 11px; justify-self: start; }
  .sadd:hover { color: var(--ink); }
  .how { min-width: 320px; max-width: 460px; white-space: normal; line-height: 1.45; } .how b { font-weight: 600; } .how code { font: 11.5px ui-monospace, Menlo, monospace; }
  .how a { color: var(--s1); }
  .scnote { margin: 0 0 0 12px; font-size: 13px; color: var(--ink2); max-width: 700px; } .scnote b { font-weight: 600; color: var(--ink); }
  .scnote .played { color: var(--muted); }
  .scnote .k-missed, .scnote .k-false { color: var(--crit); } .scnote .k-caught, .scnote .k-holds { color: var(--good); }
  .phase { font-size: 12.5px; color: var(--muted); margin: -4px 0 10px 38px; min-height: 18px; display: flex; flex-wrap: wrap; gap: 3px 12px; align-items: center; }
  .phase .pd { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; vertical-align: 1px; }
  .phase .pd:last-of-type { margin-right: 6px; }
  .label { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); margin: 0 0 3px 12px; }
  .lede { margin: 0 0 12px; }
  .sel { display: grid; gap: 10px; justify-items: start; margin-bottom: 12px; }
  .transport { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .transport input[type=range] { flex: 1; accent-color: var(--ink); }
  .transport .time { font: 12.5px ui-monospace, Menlo, monospace; color: var(--ink); min-width: 96px; }
  .playbtn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--axis); background: transparent; color: var(--ink); cursor: pointer; font-size: 11px; }
  .seg.sp button { background: transparent; }
  /* Play bar "c" (his pick, 2026-11-12): the bar sits in the light track of the big "See the telemetry" switch, chosen bits
     raised in white. --p = how far through the clip, set in paint(). */
  .transport input[type=range] { -webkit-appearance: none; appearance: none; height: 16px; background: transparent; cursor: pointer; }
  .transport input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; }
  .transport { background: #e8e7e1; border-radius: 9px; padding: 3px; gap: 8px; }
  .playbtn { border: 0; border-radius: 7px; width: 30px; height: 26px; background: var(--surface); box-shadow: 0 1px 2px rgba(11,11,11,.12); }
  .transport .time { min-width: 90px; }
  .transport input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--ink2) var(--p, 0%), rgba(11,11,11,.12) var(--p, 0%)); }
  .transport input[type=range]::-webkit-slider-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1px rgba(11,11,11,.2), 0 1px 2px rgba(11,11,11,.2); margin-top: -4px; }
  .seg.sp { border: 0; gap: 2px; background: transparent; } .seg.sp button { border: 0; border-radius: 7px; padding: 3px 10px; }
  .seg.sp button.on { background: var(--surface); box-shadow: 0 1px 2px rgba(11,11,11,.12); }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }   /* left: everything you operate and read; right: the diagram, alone */
  .side { position: sticky; top: 56px; display: grid; gap: 0; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } .side { position: static; } }

  /* panes: square, thin border, small capitalised title strip */
  .pane { border: 1px solid var(--axis); background: var(--surface); margin-bottom: 10px; }
  .pane h2 { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; margin: 0; padding: 6px 12px; min-height: 31px;
             border-bottom: 1px solid var(--axis); display: flex; align-items: center; gap: 14px; }
  .pane .pb { padding: 10px 12px 12px; }
  .side .pane { margin-bottom: 0; }
  /* a pane that belongs to step 2, shown early: same shape, drained of colour, one click away */
  .pane.later { border-color: var(--grid); }
  .pane.later h2 { color: var(--muted); border-bottom-color: var(--grid); }
  .pane.later .pb { opacity: .34; filter: grayscale(1); pointer-events: none; }
  .stepnote { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 12px; }

  /* optional readings: a menu in the Telemetry header */
  .cb { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 400; text-transform: none; letter-spacing: 0; cursor: pointer; white-space: nowrap; }
  .cb input { margin: 0; accent-color: var(--ink); }
  details.menu { position: relative; font-size: 12.5px; font-weight: 400; text-transform: none; letter-spacing: 0; }
  details.menu summary { cursor: pointer; list-style: none; border: 1px solid var(--axis); padding: 1px 9px; }
  details.menu summary::-webkit-details-marker { display: none; }
  details.menu summary::after { content: " ▾"; }
  details.menu > div { position: absolute; right: 0; top: calc(100% + 4px); z-index: 6; background: var(--surface); border: 1px solid var(--axis); padding: 9px 12px;
                       display: grid; gap: 7px; box-shadow: 0 6px 20px rgba(0,0,0,.1); }

  .seg.zm { border-radius: 0; border-color: var(--axis); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .seg.zm button { padding: 1px 9px; background: transparent; } .seg.zm button + button { border-left-color: var(--axis); } .seg.zm button.on { background: var(--grid); }
  .tl { cursor: pointer; position: relative; }
  .tl.nolink { cursor: default; }
  .tl svg { display: block; width: 100%; }
  .jtip { position: absolute; display: none; pointer-events: none; z-index: 3; background: var(--ink); color: var(--surface);
          font-size: 12px; line-height: 1.5; padding: 6px 10px; white-space: nowrap; }
  .jtip b { font-weight: 600; } .jtip .m { opacity: .72; } .jtip .bad { color: #ff9d9d; }
  #app .compact .boxes { margin: 0; }
  #app .box .st, #app .box .pill { display: none; }   /* no "recording" / "streaming" notes beside each node */

  /* rules */
  .rule { display: grid; grid-template-columns: 14px 180px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--grid); }
  .rule:first-of-type { padding-top: 2px; } .rule:last-of-type { border-bottom: 0; padding-bottom: 0; }
  .rule .dot { width: 9px; height: 9px; border-radius: 50%; margin: 0; }
  .rname { font: 13px ui-monospace, Menlo, monospace; }
  .rtext { font-size: 13.5px; }
  .rule .pill { font-size: 12px; padding: 1px 9px; border-radius: 0; white-space: nowrap; }
  .pill.ok { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
  .pill.bad { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit); }
  .pill.wait { background: var(--grid); color: var(--ink2); }

  /* connect steps */
  .steps { display: grid; gap: 12px; }
  .step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; }
  .step .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--axis); font-size: 11.5px; display: flex; align-items: center; justify-content: center; }
  .step b { font-size: 13.5px; display: block; }
  .step p { margin: 3px 0 0; font-size: 12.5px; }
  .step pre { margin: 6px 0 0; padding: 8px 10px; background: var(--page); border: 1px solid var(--ring); font: 11.5px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .step a { color: var(--s1); }
  .mockonly { font-size: 11.5px; border-bottom: 1px dashed var(--axis); cursor: pointer; }

  /* What flows where */
  .arch { display: block; width: 100%; color: var(--ink2); margin-top: 6px; }
  .arch text { font-size: 11px; fill: var(--ink); }
  .arch .a-t { font-size: 11.5px; font-weight: 600; }
  .arch .a-s { font-size: 10px; fill: var(--muted); }
  .arch .a-org { fill: color-mix(in srgb, var(--s1) 18%, var(--surface)); stroke: var(--s1); stroke-width: 1.3; }
  .arch .a-prover { fill: color-mix(in srgb, var(--crit) 8%, transparent); stroke: color-mix(in srgb, var(--crit) 65%, transparent); stroke-width: 1.2; }
  .arch .a-node { fill: var(--s1); }
  .arch .a-nt { fill: #fff; font-size: 11.5px; font-weight: 600; } .arch .a-ns { fill: #fff; font-size: 10px; }
  .arch .a-box { fill: var(--surface); stroke: var(--axis); }
  .arch .a-line { fill: none; stroke: currentColor; stroke-width: 1.3; }
  .arch .a-line.dash { stroke-dasharray: 4 4; }
  .arch .a-dots { fill: none; stroke: var(--s1); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 0.1 15; animation: flow 1.2s linear infinite; }
  .arch.paused .a-dots { animation-play-state: paused; }
  @keyframes flow { to { stroke-dashoffset: -15.1; } }
  .arch .a-gpu { fill: var(--axis); }
  .arch.rawmode .a-later { opacity: .2; } .arch.rawmode .a-later .a-dots { display: none; }
  /* 1b (his pick, 2026-11-12): Slurm is a hatched band round the nodes it runs; declarations leave it in green */
  .arch .a-sched { fill: url(#a-hatch); stroke: var(--axis); }
  .arch .a-decl { color: var(--good); } .arch .a-decl .a-dots { stroke: var(--good); }
  .arch .a-decl text.lab { fill: color-mix(in srgb, var(--good) 75%, var(--ink)); }
</style>
</head>
<body>
<script src="/static/nav.js"></script>
<div id="app"></div>
<script src="/static/live.js"></script>

<script>
const $ = (s, r = document) => r.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mmss = s => { s = Math.max(0, Math.round(s)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
const dur = s => { s = Math.max(0, Math.round(s)); return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`; };

// ---------------------------------------------------------------- recordings
// index.json lists the recordings and the step-2 scenarios (with the real rules' verdicts); <id>.json holds one
// recording's readings, once a second, as integers. Both are written by demo-classifier/make_replay_data.py.
// <id>.hz10.json is the same recording ten times a second (the five GPU readings only, at the counters' own
// polling rate). The last-minute strips draw it once it has arrived, and the 1 Hz file until then.
// Everything else on the page (lanes, whole-clip view, rules, the network row) uses 1 Hz.
const DATA = "/static/replay-data/", REC = {}, REC10 = {}, asked = {};
let IDX = null;
function need(W) { for (const n of W.nodes) if (n.rec) for (const [sfx, store] of [["", REC], [".hz10", REC10]])
  if (!asked[n.rec + sfx]) { asked[n.rec + sfx] = 1; fetch(DATA + n.rec + sfx + ".json").then(r => r.json()).then(d => { store[n.rec] = d; paint(); }); } }
const RULES = [["undeclared_load", "No busy GPU outside a declared job"],
               ["training_shaped", "Inference jobs don't look like training"],
               ["boundary_traffic", "Separate jobs don't send bulk data to each other"]];

// Step 1: which recording plays is chosen with levers. A cell is one recorded combination: pick = the option chosen
// in each lever, nodes = the recording on each node. A clip runs from the mark `at` (`before` seconds earlier) to the
// mark `to` (`after` seconds later); with neither, it is the whole recording. index.json lists each recording's marks
// (server_start, server_ready, warm_16, load_16, load_end_16, ...).
// A serving clip is that concurrency's own run: the load generator's cache warm-up, then the 15 minutes of measured
// load. Server loading and any other concurrency in the same recording are left out (no margins: 16 and 64 sit
// 14 s apart in one recording, so a margin would show the neighbour).
const TT = "TorchTitan, Llama 3 8B, one job on all 8 GPUs, sequence length 8,192", AX = n => `AgentX replaying recorded Claude Code sessions, ${n} at once`;
const VL = "vLLM 0.33.0, DeepSeek V4.1 Flash";
const KINDS = {
  pre: { levers: [
      { label: "Batch per GPU", opts: ["4", "1"] },
      { label: "Activation checkpointing", opts: ["default", "middle"] }],
    cells: [
      { pick: [0, 0], nodes: [["node-a", "p1b"]], how: [["Workload", `${TT}, batch 4`], ["Checkpoint saves", "every 60 steps, 90 GB, about 35 s each; training waits"],
          ["Measured", "about 2.8 s a step; a repeat of this run drew 558 W against 560 W per GPU"]] },
      { pick: [1, 0], nodes: [["node-a", "p3"]], how: [["Workload", `${TT}, batch 1`], ["Checkpoint saves", "every 210 steps, 90 GB, about 35 s each; training waits"],
          ["Measured", "about 0.8 s a step"]] },
      { pick: [0, 1], nodes: [["node-a", "p2"]], how: [["Workload", `${TT}, batch 4`], ["Activation checkpointing", "recompute only the feed-forward's wide layer on the way back; half the memory (60 GiB against 115)"],
          ["Checkpoint saves", "every 60 steps, 90 GB, about 35 s each"], ["Measured", "about 3.2 s a step"],
          ["Caveat", "a package install ran on this node for 2 minutes of the recording"]] }] },
  inf: { levers: [
      { label: "Model", opts: ["DeepSeek V4.1 Flash", "MiniMax M3.1 Flash", "Qwen 3.8 Flash"] },
      { label: "Layout", opts: ["tensor-parallel", "expert-parallel", "prefill and decode split, two nodes"] },
      { label: "Concurrency", opts: ["4", "16", "64"] }],
    cells: [
      { pick: [0, 0, 1], nodes: [["node-a", "i1"]], at: "warm_16", before: 0, to: "load_end_16", after: 0, how: [["Server", `${VL}, one server, <code>--tensor-parallel-size 8</code>`], ["Load", AX(16)], ["Measured", "660 tokens/s out"]] },
      { pick: [0, 0, 2], nodes: [["node-a", "i1"]], at: "warm_64", before: 0, to: "load_end_64", after: 0, how: [["Server", `${VL}, one server, <code>--tensor-parallel-size 8</code>`], ["Load", AX(64)], ["Measured", "1,802 tokens/s out"]] },
      { pick: [0, 1, 1], nodes: [["node-a", "i2"]], at: "warm_16", before: 0, to: "load_end_16", after: 0, how: [["Server", `${VL}, <code>--data-parallel-size 8 --enable-expert-parallel</code> behind vllm-router`], ["Load", AX(16)], ["Measured", "652 tokens/s out"]] },
      { pick: [0, 2, 1], nodes: [["node-a · prefill", "i3p"], ["node-b · decode", "i3d"]], at: "warm_16", before: 0, to: "load_end_16", after: 0,
        how: [["Server", `${VL}, two servers: prefill on node-a, decode on node-b, cached context handed over the network (NixlConnector, 8 × 200 Gb/s Ethernet ports a node)`],
              ["Load", AX(16) + ", through a proxy"], ["Measured", "662 tokens/s out; almost every prompt token reached the decode server by transfer"]] }] },
};
const RAW_NAMES = ["Pretraining", "Inference", "Side by side"], KIND = ["pre", "inf"];
// Side by side: any recordings, one row each (st.side), up to SIDE_MAX nodes in all (the split takes two). Clips are
// lined up to start together and the shortest sets the length. A pretraining clip starts 60 s before training does.
const SIDE_MAX = 4, LETTERS = "abcdefgh", KTITLE = { pre: "Pretraining", inf: "Inference" };

    else st.now = Math.min(world().dur, st.now + dt * st.speed);
  }
  paint();
}, 200);
addEventListener("resize", paint);
render();
fetch(DATA + "index.json").then(r => r.json()).then(d => { d.scenarios.forEach(q => { q.extra = []; }); IDX = d; render(); });
</script>
