<svg class="tf" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Inside the prover, GPU nodes run under a central Slurm scheduler. A collector on each node sends reported telemetry to the verification node; the scheduler sends its declared Slurm workloads to the same node.">
<style>
  svg.tf text { font-family: var(--font-mono, "Geist Mono", ui-monospace, Menlo, monospace); font-size: 11px; letter-spacing: .07em; fill: var(--ink, #07080c); }
  svg.tf text.tf-m { fill: var(--muted, #686e88); font-size: 10px; }
  svg.tf text.tf-on { fill: var(--on-acc, #ffffff); }
  svg.tf .tf-ln { fill: none; stroke: var(--ink, #07080c); stroke-width: 1; }
  svg.tf .tf-bd { fill: none; stroke: var(--ink, #07080c); stroke-width: 1; stroke-dasharray: 3 4; opacity: .55; }
  svg.tf .tf-da { fill: none; stroke: var(--acc, #7b2d7b); stroke-width: 1.3; stroke-dasharray: 5 4; }
  svg.tf .tf-acc { fill: var(--acc, #7b2d7b); }
  svg.tf .tf-ack { fill: none; stroke: var(--acc, #7b2d7b); stroke-width: 1.3; }
  svg.tf .tf-pan { fill: var(--surface, #ffffff); stroke: var(--ring, #07080c22); }
  svg.tf .tf-tile, svg.tf .tf-ah { fill: var(--ink, #07080c); }
  svg.tf .tf-host { fill: var(--surface, #ffffff); stroke: var(--ink, #07080c); stroke-width: 1; }
  svg.tf .tf-rl { fill: none; stroke: var(--ring, #07080c22); stroke-width: 1; }
  svg.tf text.tf-cl { fill: var(--muted, #686e88); font-size: 10px; letter-spacing: .05em; }
</style>
