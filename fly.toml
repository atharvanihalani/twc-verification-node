# Verification node (demo). One always-on machine; state is in memory, except recordings made on the Replay page,
# which go to the volume at /data (created 2026-11-21: fly volumes create twc_data --region sjc --size 1).
app = "twc-verification-node"
primary_region = "sjc"

[env]
  TWC_DATA_DIR = "/data"

[mounts]
  source = "twc_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
